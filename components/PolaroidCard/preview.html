<!-- @dsCard group="Contenuti" height=540 subtitle="Le tre linee a ventaglio" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;700&display=swap">
<style>
  html,body{margin:0}
  body{background:var(--surface-alt)}
  .stage{background:var(--surface-alt);height:540px;position:relative;overflow:hidden;font-family:var(--font-sans)}
  .fan{position:absolute;left:50%;top:44px;width:320px;margin-left:-160px}
  .card{position:absolute;left:0;top:0;width:320px;transform-origin:50% 85%}
  .pol{background:var(--polaroid-paper);border-radius:var(--radius-card);padding:var(--space-14) var(--space-14) var(--space-26);box-shadow:var(--shadow-polaroid);border:1px solid var(--polaroid-border)}
  .photo{aspect-ratio:3.2/4;border-radius:var(--radius-photo);overflow:hidden;background:var(--umber);box-shadow:var(--shadow-photo);display:grid;place-items:center}
  .photo img{width:62%;height:auto;display:block}
  .cap{margin-top:var(--space-14);font:400 14px/1.3 var(--font-sans);letter-spacing:.02em;color:var(--polaroid-caption);text-align:center}
  .c1{transform:translate(-120px,26px) rotate(-8deg);z-index:2;opacity:.92;filter:saturate(.92)}
  .c3{transform:translate(120px,26px) rotate(8deg);z-index:1;opacity:.92;filter:saturate(.92)}
  .c2{transform:translateY(-10px) scale(1.06);z-index:3}
  .c2 .pol{box-shadow:var(--shadow-polaroid-active)}
</style>
<div class="stage">
  <div class="fan">
    <figure class="card c1" style="margin:0"><div class="pol"><div class="photo"><img src="/_blob/c85eb046d9cbcae0468e8a840a0752a7" alt=""></div><div class="cap">Wanderland <strong>Labs</strong></div></div></figure>
    <figure class="card c3" style="margin:0"><div class="pol"><div class="photo"><img src="/_blob/c85eb046d9cbcae0468e8a840a0752a7" alt=""></div><div class="cap">Wanderland <strong>Expeditions</strong></div></div></figure>
    <figure class="card c2" style="margin:0"><div class="pol"><div class="photo"><img src="/_blob/c85eb046d9cbcae0468e8a840a0752a7" alt=""></div><div class="cap">Wanderland <strong>Weekends</strong></div></div></figure>
  </div>
</div>
