<!-- @dsCard group="Azioni" height=200 subtitle="Principale e secondario del form" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;700&display=swap">
<style>
  html,body{margin:0}
  body{background:var(--surface);}
  .stage{min-height:100vh;box-sizing:border-box;align-content:start;background:var(--surface);color:var(--text-body);padding:32px 24px;display:grid;gap:20px;font-family:var(--font-sans)}
  .row{display:flex;gap:var(--space-12);max-width:420px}
  .btn{flex:1 1 0;min-width:0;box-sizing:border-box;padding:var(--space-14) var(--space-26);font:400 13px/1.1 var(--font-sans);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;border-radius:var(--radius-pill);cursor:pointer}
  .next{background:var(--button-bg);color:var(--button-text)}
  .back{background:var(--button-secondary-bg);color:var(--button-secondary-text);border:2px solid var(--button-secondary-border)}
  .cap{font:300 14px/1.3 var(--font-sans);color:var(--text-caption)}
</style>
<div class="stage" data-theme="dark">
  <div class="row"><button class="btn back">Indietro</button><button class="btn next">Procedi</button></div>
  <div class="row"><button class="btn next">Iscriviti</button></div>
  <div class="cap">Principale su sezione scura, con il secondario "Indietro".</div>
</div>
