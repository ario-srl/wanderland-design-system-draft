<!-- @dsCard group="Form" height=380 subtitle="Campo, select e scelta Sì / No" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&display=swap">
<style>
  html,body{margin:0}
  body{background:var(--surface)}
  .stage{min-height:100vh;box-sizing:border-box;align-content:start;background:var(--surface);padding:32px 24px;font-family:var(--font-sans);display:grid;gap:20px;max-width:440px}
  label.l{display:block;margin-bottom:10px;color:var(--field-label);font:500 18px/1.3 var(--font-sans)}
  input[type=text],select{box-sizing:border-box;width:100%;padding:var(--space-10);border:1px solid var(--field-border);background:var(--field-bg);color:var(--field-text);font:400 18px/1.3 var(--font-sans);border-radius:var(--radius-field);appearance:none;-webkit-appearance:none;background-image:none}
  select{background:var(--field-select-bg)}
  input::placeholder{font-size:.8em;color:var(--field-placeholder);letter-spacing:.01em}
  input:focus{outline:none;border-width:2px;padding:9px}
  .sel{position:relative}
  .sel::after{content:"";position:absolute;right:16px;top:50%;width:8px;height:8px;margin-top:-7px;border-right:1.5px solid var(--field-text);border-bottom:1.5px solid var(--field-text);transform:rotate(45deg);pointer-events:none}
  .choices{display:flex;gap:24px}
  .choices label{display:flex;align-items:center;gap:8px;color:var(--field-label);font:400 18px/1.3 var(--font-sans)}
  .choices input{appearance:none;-webkit-appearance:none;margin:0;width:15px;height:15px;border:1px solid var(--field-check);background:transparent;border-radius:50%;flex:none;display:grid;place-items:center}
  .choices input:checked{background:var(--field-check);box-shadow:inset 0 0 0 3px var(--surface)}
  .choices input.sq{border-radius:3px}
  .choices input.sq:checked{box-shadow:none;background:var(--field-check)}
  .choices input.sq:checked::after{content:"";width:4px;height:8px;margin-top:-2px;border-right:2px solid var(--surface);border-bottom:2px solid var(--surface);transform:rotate(45deg)}
</style>
<div class="stage" data-theme="dark">
  <div><label class="l">Email*</label><input type="text" placeholder="nome@esempio.it"></div>
  <div><label class="l">Regione in cui vivi*</label><div class="sel"><select><option>Seleziona la regione</option></select></div></div>
  <div><label class="l">Hai un veicolo 4x4?*</label>
    <div class="choices"><label><input type="radio" name="v" checked> Sì</label><label><input type="radio" name="v"> No</label></div></div>
  <div><label class="l">Che tipo di percorsi hai già affrontato?*</label>
    <div class="choices"><label><input class="sq" type="checkbox" checked> Strade bianche o sterrati semplici</label><label><input class="sq" type="checkbox"> Fuoristrada tecnico</label></div></div>
</div>
